name: Build, sync and deploy

# Three ways this runs:
#   • every push to main            → rebuild and deploy
#   • twice a day, 03:15 and 15:15 UTC → pull new papers from INSPIRE-HEP first
#     (GitHub starts scheduled runs hours late, and sometimes skips one, so a
#      second run keeps the site from falling a day behind)
#   • manually (Actions → Run)      → same as the scheduled runs
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Run the INSPIRE-HEP sync before building"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.22.0"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── 1. Pull anything new from INSPIRE-HEP ────────────────────────────
      # This runs on every trigger, including pushes: the bot's commit uses
      # GITHUB_TOKEN, and GitHub does not re-trigger workflows from that, so
      # there is no risk of a loop.
      - name: Install PDF and WebP tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils webp

      - name: Sync publications from INSPIRE-HEP
        continue-on-error: true          # a bad day at INSPIRE must not block a deploy
        run: python3 tools/sync_inspire.py

      - name: Commit anything the sync produced
        run: |
          git config user.name  "Satyajit Puhan"
          git config user.email "puhansatyajit@gmail.com"
          git add -A content/portfolio static/sections/news static/data static/images/portfolio/papers
          if git diff --cached --quiet; then
            echo "Nothing new on INSPIRE-HEP today."
          else
            git commit -m "chore(sync): pull new papers and citation counts from INSPIRE-HEP"
            # GitHub occasionally answers a push with "Internal Server Error".
            # Retry a few times (rebasing in case main moved meanwhile); if it
            # still fails, deploy anyway - the next run syncs and pushes again.
            for attempt in 1 2 3; do
              git push origin HEAD:main && exit 0
              echo "Push failed (attempt $attempt), retrying..."
              sleep $((attempt * 20))
              git pull --rebase origin main || { git rebase --abort || true; }
            done
            echo "::warning::Could not push the INSPIRE-HEP sync commit; deploying anyway."
          fi

      # ── 2. Build ─────────────────────────────────────────────────────────
      # Zola comes from its GitHub release. Those downloads sometimes fail for a while
      # (HTTP 503/504, or an error page: "gzip: stdin: not in gzip format"), so the
      # binary is cached between runs and the download is only needed on a cache miss.
      - name: Restore cached Zola
        id: zola-cache
        uses: actions/cache@v4
        with:
          path: ~/.zola-bin
          key: zola-${{ env.ZOLA_VERSION }}-x86_64-linux

      - name: Install Zola
        run: |
          mkdir -p ~/.zola-bin
          if [ ! -x ~/.zola-bin/zola ]; then
            url="https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            for i in 1 2 3 4; do
              if curl -fsSL --retry 3 --retry-all-errors -o /tmp/zola.tar.gz "$url" && gzip -t /tmp/zola.tar.gz; then
                break
              fi
              echo "::warning::Zola download failed (attempt $i of 4), retrying"
              rm -f /tmp/zola.tar.gz
              sleep $((i * 15))
            done
            if [ -s /tmp/zola.tar.gz ]; then
              tar xzf /tmp/zola.tar.gz -C ~/.zola-bin zola
            else
              # same release, published by Zola as a container image on ghcr.io
              echo "::warning::Zola release download unavailable; using the official ghcr.io image instead"
              img="ghcr.io/getzola/zola:v${ZOLA_VERSION}"
              docker pull -q "$img"
              bin=$(docker inspect -f '{{index .Config.Entrypoint 0}}' "$img")
              cid=$(docker create "$img")
              docker cp "$cid:$bin" ~/.zola-bin/zola
              docker rm "$cid" >/dev/null
            fi
          fi
          echo "$HOME/.zola-bin" >> "$GITHUB_PATH"
          ~/.zola-bin/zola --version

      - name: Build site
        run: zola --config zola.toml build --minify

      - name: Check internal links and templates
        run: zola --config zola.toml check --skip-external-links || true

      # ── 3. Deploy ────────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          user_name: "Satyajit Puhan"
          user_email: "puhansatyajit@gmail.com"
          commit_message: "deploy: ${{ github.event.head_commit.message || 'scheduled rebuild' }}"
