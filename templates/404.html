{% extends "base.html" %}
{% block title %}Page not found · {{ config.title }}{% endblock %}
{% block content %}
<section class="section" style="padding-top:calc(var(--nav-h) + 90px);text-align:center">
  <div class="wrap">
    <p class="eyebrow" style="justify-content:center">404</p>
    <h1 class="h-hero grad-text" style="margin-bottom:16px">Lost in the light cone</h1>
    <p class="lede" style="max-width:52ch;margin:0 auto 28px">
      That page is not on this site. It may have moved, or the link may be mistyped.
    </p>
    <p style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn--primary" href="{{ get_url(path='/', lang=lang) }}">Back home</a>
      <a class="btn btn--ghost" href="{{ get_url(path='/', lang=lang) }}#portfolio">Publications</a>
      <button class="btn btn--ghost" data-palette-open type="button">Search the site</button>
    </p>
  </div>
</section>
{% endblock %}
