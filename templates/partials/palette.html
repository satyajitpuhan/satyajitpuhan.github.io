{% import 'partials/icons.html' as ic %}
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search this site">
  <div class="palette__box">
    <div class="palette__input">
      {{ ic::ui(name="search") }}
      <input id="palette-input" type="search" placeholder="{% if lang == 'or' %}ଖୋଜନ୍ତୁ…{% else %}Search papers, talks, pages…{% endif %}" autocomplete="off" spellcheck="false" aria-label="Search">
    </div>
    <div class="palette__results" id="palette-results"></div>
    <div class="palette__hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
